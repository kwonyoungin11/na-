# 동국문화재연구원 낙찰분석프로그램
# C# 데스크톱·Python 수집기는 C++(nara_collect_cpp)로 재개발 중.
# 새 작업 트리: 시크릿 복사 + 운영데이터 공유 + C++ cmake 구성/빌드.
# Python 수집 파이프라인은 여기서 실행하지 않는다.

scripts:
  setup: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/orca-worktree-setup.ps1

worktree:
  sharedDirectories:
    - nara-workspace/master
    - nara-workspace/app
    - nara-workspace/output
    - nara-workspace/first-stage
    - nara-workspace/source-data
    - nara-workspace/analysis
    - nara-workspace/reports
    - nara-workspace/logs
