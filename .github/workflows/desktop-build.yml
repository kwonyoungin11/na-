name: Desktop tests + build

on:
  workflow_call:

jobs:
  desktop-tests-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore desktop tests
        run: dotnet restore cc-feature-implementer/desktop/NaraCollector.Desktop.Tests/NaraCollector.Desktop.Tests.csproj

      - name: Run desktop tests
        run: dotnet test cc-feature-implementer/desktop/NaraCollector.Desktop.Tests/NaraCollector.Desktop.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Build desktop app
        run: dotnet build cc-feature-implementer/desktop/NaraCollector.Desktop/NaraCollector.Desktop.csproj --configuration Release --verbosity minimal

      - name: Build analytics CLI
        run: dotnet build cc-feature-implementer/desktop/NaraCollector.Analytics.Cli/NaraCollector.Analytics.Cli.csproj --configuration Release --verbosity minimal

      - name: Configure and build C++ desktop & collector
        run: |
          cmake -S cc-feature-implementer/desktop/nara_collect_cpp -B cc-feature-implementer/desktop/nara_collect_cpp/build_ci
          cmake --build cc-feature-implementer/desktop/nara_collect_cpp/build_ci --config Release

      - name: Run C++ CTest suite
        run: ctest --test-dir cc-feature-implementer/desktop/nara_collect_cpp/build_ci -C Release --output-on-failure
