name: Project CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: project-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests openpyxl pytest

      - name: Run Python tests file-by-file
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          repo_root = Path.cwd()
          test_files = sorted((repo_root / "cc-feature-implementer" / "tests").glob("test_*.py"))
          if not test_files:
              raise SystemExit("No Python test files found.")

          failures = []
          for test_file in test_files:
              print(f"=== {test_file.relative_to(repo_root)} ===", flush=True)
              result = subprocess.run(
                  [sys.executable, "-m", "pytest", str(test_file), "-q"],
                  cwd=repo_root,
                  check=False,
              )
              if result.returncode != 0:
                  failures.append(str(test_file.relative_to(repo_root)))

          if failures:
              print("FAILED TEST FILES:")
              for failure in failures:
                  print(f" - {failure}")
              raise SystemExit(1)
          PY

  desktop-tests-build:
    runs-on: windows-latest
    needs: python-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore desktop tests
        run: dotnet restore cc-feature-implementer/desktop/NaraCollector.Desktop.Tests/NaraCollector.Desktop.Tests.csproj

      - name: Run desktop tests
        run: dotnet test cc-feature-implementer/desktop/NaraCollector.Desktop.Tests/NaraCollector.Desktop.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Build desktop app
        run: dotnet build cc-feature-implementer/desktop/NaraCollector.Desktop/NaraCollector.Desktop.csproj --configuration Release --verbosity minimal

      - name: Build analytics CLI
        run: dotnet build cc-feature-implementer/desktop/NaraCollector.Analytics.Cli/NaraCollector.Analytics.Cli.csproj --configuration Release --verbosity minimal
