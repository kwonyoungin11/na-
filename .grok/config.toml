# Project Grok config (mcp_servers / plugins / permission / mcp.max_output_bytes).
# Skills: .grok/skills/   Hooks: .grok/hooks/

[mcp]
max_output_bytes = 40000

[mcp_servers.sequential-thinking]
command = "npx.cmd"
args = [
    "-y",
    "@modelcontextprotocol/server-sequential-thinking",
]
enabled = true
startup_timeout_sec = 60

[mcp_servers.context7]
command = "npx.cmd"
args = [
    "-y",
    "@upstash/context7-mcp",
]
enabled = true
startup_timeout_sec = 60
